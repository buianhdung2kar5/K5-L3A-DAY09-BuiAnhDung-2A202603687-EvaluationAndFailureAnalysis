# M5: each attack mechanism in data/eval/adversarial_v2.json -> the FM code in docs/failure_taxonomy.md.
ticket_over_db: FM-03          # ticket text overrides the order row
stale_policy: FM-06            # superseded or not-yet-effective clause
clause_sum: FM-04              # clauses added instead of taking the larger
double_deduct: FM-05           # prior refund subtracted by the shape and again by the host
sibling_refund: FM-07          # ledger written for a sibling claim on the same order
denied_ignored: FM-02          # host denial reported as resolved
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold
cross_principal: FM-09         # another principal's order or PII
